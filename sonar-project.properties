# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
#
# No sonar.organization or sonar.projectKey here: the workflow passes both,
# built from the repository it runs in (`<owner>_<repository name>`), which
# is the key SonarQube Cloud gives a project imported from GitHub by default.
# The project is imported under that key with Automatic Analysis turned off
# (the two cannot run side by side), and a SONAR_TOKEN secret is visible to
# the repository.

# Sources are the whole tree rather than a list of files, so a new file is
# analyzed without anyone remembering to add it here. Sonar reads the
# languages it has an analyzer for (Python, the workflows, YAML and the
# container files) plus its secrets detection, which runs over every text
# file. .secrets.baseline is generated by detect-secrets and only records
# hashes. tests/ is analyzed as test code, so its fixtures (fake home paths,
# commands that would be refused) are not reported as findings in the code
# that ships. No coverage report yet: the suite runs in the test container
# (`make test`), and wiring its coverage into the scan is a follow up.
sonar.sources=.
sonar.exclusions=.secrets.baseline,tests/**
sonar.tests=tests
sonar.python.version=3.11

sonar.sourceEncoding=UTF-8
