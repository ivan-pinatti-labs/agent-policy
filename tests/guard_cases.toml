# SPDX-License-Identifier: Apache-2.0
#
# What the guard decides for a command line. expect: deny | ask | none.
# Every change to lib/agent_policy/checks.py comes with a case here.
# cwd defaults to /work/project; HOME is /home/user; the protected deployment
# is /home/user/live, and the fake engine knows a container "live-app" that
# belongs to it and "dev-app" that does not.

# git push
[[case]]
command = "git push origin feature"
expect = "none"
[[case]]
command = "git push -u origin feature"
expect = "none"
[[case]]
command = "git push --force origin feature"
expect = "deny"
[[case]]
command = "git push origin feature --force"
expect = "deny"
[[case]]
command = "git push origin feature --force-with-lease=feature:abc"
expect = "deny"
[[case]]
command = "git push -uf origin feature"
expect = "deny"
[[case]]
command = "git push origin +feature"
expect = "deny"
[[case]]
command = "git push origin :feature"
expect = "deny"
[[case]]
command = "git push origin :feature --verbose"
expect = "deny"
[[case]]
command = "git push --delete origin feature"
expect = "deny"
[[case]]
command = "git push --mirror backup"
expect = "deny"
[[case]]
command = "git push origin HEAD:refs/heads/feature"
expect = "none"
[[case]]
command = "git -C ../repo push origin main --force"
expect = "deny"
[[case]]
command = "cd repo && timeout 60 git push origin x --force"
expect = "deny"
[[case]]
command = "echo done; bash -c 'git push --force'"
expect = "deny"
[[case]]
command = "git push -o ci.skip origin feature"
expect = "none"
[[case]]
command = "git push --follow-tags origin feature"
expect = "none"

# hooks bypass
[[case]]
command = "git commit --no-verify -m wip"
expect = "deny"
[[case]]
command = "git commit -nm wip"
expect = "deny"
[[case]]
command = "git commit -m 'skip -n in message'"
expect = "none"
[[case]]
command = "git commit -am 'fix: thing'"
expect = "none"
[[case]]
command = "HUSKY=0 git commit -m x"
expect = "deny"
[[case]]
command = "SKIP=gitleaks git commit -m x"
expect = "deny"
[[case]]
command = "git -c core.hooksPath=/dev/null commit -m x"
expect = "deny"
[[case]]
command = "git push --no-verify"
expect = "deny"
[[case]]
command = """git commit -F - <<'EOF'
fix: mention git push --force in the message body
EOF"""
expect = "none"

