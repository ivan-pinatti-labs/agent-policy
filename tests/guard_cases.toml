[[case]]
command = "git checkout -b feature origin/main"
expect = "none"
[[case]]
command = "git branch -D old"
expect = "ask"
[[case]]
command = "git branch -d merged"
expect = "none"
[[case]]
command = "git stash drop"
expect = "ask"
[[case]]
command = "git stash pop"
expect = "none"
[[case]]
command = "git clean -fdx"
expect = "ask"
[[case]]
command = "git restore --staged file.txt"
expect = "none"
[[case]]
command = "git restore file.txt"
expect = "ask"
[[case]]
command = "git tag -d v1.0.0"
expect = "ask"
[[case]]
command = "git remote set-url origin git@example.invalid:x/y.git"
expect = "ask"
[[case]]
command = "git filter-repo --path secret --invert-paths"
expect = "deny"

