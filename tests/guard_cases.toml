# container engines
[[case]]
command = "podman container rm -f live-app"
expect = "deny"
[[case]]
command = "podman"
expect = "none"
[[case]]
command = "podman cp ./notes.txt dev-app:/tmp/notes.txt"
expect = "none"
[[case]]
command = "podman cp dev-app:/etc/hosts ./hosts"
expect = "none"
[[case]]
command = "podman stop -t 5 live-app"
expect = "deny"
[[case]]
command = "podman compose -f compose.yml"
expect = "none"
[[case]]
command = "podman run --rm -v ~/.config/app:/c alpine true"
expect = "ask"
[[case]]
command = "podman run --rm --volume=/home/user/.ssh:/s alpine true"
expect = "deny"
[[case]]
command = "podman run --rm --mount type=tmpfs,dst=/t alpine true"
expect = "none"
[[case]]
command = "podman run --rm --mount type=bind,dst=/t alpine true"
expect = "none"
[[case]]
command = "podman run --rm --security-opt label=disable alpine true"
expect = "ask"
[[case]]
command = "podman run --rm -v /home/user/live:/data alpine true"
expect = "deny"

# credential names and ${HOME}
[[case]]
command = "cat ${HOME}/.ssh/id_rsa"
expect = "deny"
[[case]]
command = "cat /tmp/id_rsa"
expect = "deny"

# the shell splitter
[[case]]
command = "echo x >&2x"
expect = "none"
[[case]]
command = "FOO=1"
expect = "none"
[[case]]
command = "timeout -s KILL 5 git push origin x --force"
expect = "deny"
[[case]]
command = "env -- git push origin x --force"
expect = "deny"
[[case]]
command = "timeout"
expect = "none"
[[case]]
command = "echo x >"
expect = "none"
[[case]]
command = "bash -c \"bash -c 'bash -c \\\"bash -c true\\\"'\""
expect = "none"
[[case]]
command = "bash script.sh"
expect = "none"
[[case]]
command = "bash -x -c 'git push origin x --force'"
expect = "deny"
[[case]]
command = "eval git push origin x --force"
expect = "deny"
[[case]]
command = "grep --max-count 3 token notes.txt"
expect = "none"
[[case]]
command = "git config user.name me"
expect = "none"
[[case]]
command = "timeout --preserve-status 5 true"
expect = "none"
# Nesting deeper than the guard reads is asked about, never passed unchecked.
[[case]]
command = "eval eval eval eval eval eval true"
expect = "ask"
[[case]]
command = "eval eval eval eval eval eval rm -rf /"
expect = "ask"
[[case]]
command = "echo $(echo $(echo $(echo $(echo $(echo $(rm -rf /))))))"
expect = "deny"
[[case]]
command = "eval eval eval eval rm -rf /"
expect = "deny"
[[case]]
command = "podman run --rm --security-opt no-new-privileges alpine true"
expect = "none"

# git --exec-path: the folder git runs its helpers from
[[case]]
command = "git --exec-path=/tmp/x fetch"
expect = "deny"
[[case]]
command = "git -C /work/other --exec-path=/tmp/x status"
expect = "deny"
[[case]]
command = "GIT_EXEC_PATH=/tmp/x git fetch"
expect = "deny"
[[case]]
command = "git --exec-path"
expect = "none"

# Claude Code's memory notes are read like any notes; the folder itself,
# the rest of the login's folder, and writing the notes are still refused.
[[case]]
command = "cat /home/user/.claude/projects/p/memory/MEMORY.md"
expect = "none"
[[case]]
command = "grep topic /home/user/.claude-personal/projects/p/memory/note.md"
expect = "none"
[[case]]
command = "grep -r topic /home/user/.claude-personal/projects/p/memory"
expect = "deny"
[[case]]
command = "head -5 < /home/user/.claude/projects/p/memory/note.md"
expect = "none"
[[case]]
command = "cat /home/user/.claude/projects/p/session.jsonl"
expect = "deny"
[[case]]
command = "cat /home/user/.claude/projects/p/memory/../../../.credentials.json"
expect = "deny"
[[case]]
command = "cat /home/user/.claude/projects/memory"
expect = "deny"
[[case]]
command = "cat /home/user/.claude/notes/p/memory/a.md"
expect = "deny"
[[case]]
command = "tee /home/user/.claude/projects/p/memory/note.md"
expect = "deny"

# More commands that print a file's content: each reads a credential only
# with a refusal, and a project file freely.
[[case]]
command = "diff /dev/null ~/.ssh/id_ed25519"
expect = "deny"
[[case]]
command = "diff -u --from-file=~/.netrc notes.md"
expect = "deny"
[[case]]
command = "sdiff ~/.pgpass notes.md"
expect = "deny"
[[case]]
command = "diff3 a b ~/.git-credentials"
expect = "deny"
[[case]]
command = "comm ~/.pgpass /dev/null"
expect = "deny"
[[case]]
command = "join ~/.git-credentials ~/.git-credentials"
expect = "deny"
[[case]]
command = "paste ~/.netrc"
expect = "deny"
[[case]]
command = "look a ~/.netrc"
expect = "deny"
[[case]]
command = "expand ~/.aws/credentials"
expect = "deny"
[[case]]
command = "unexpand ~/.aws/credentials"
expect = "deny"
[[case]]
command = "pr ~/.netrc"
expect = "deny"
[[case]]
command = "iconv -f utf8 -t ascii ~/.netrc"
expect = "deny"
[[case]]
command = "shuf ~/.netrc"
expect = "deny"
[[case]]
command = "csplit ~/.netrc 2"
expect = "deny"
[[case]]
command = "diff -u old.txt new.txt"
expect = "none"
[[case]]
command = "paste a.csv b.csv"
expect = "none"

# jq and yq: the filter is not a path, the files they read are.
[[case]]
command = "jq . ~/.claude/.credentials.json"
expect = "deny"
[[case]]
command = "jq -r .token < ~/.claude/.credentials.json"
expect = "deny"
[[case]]
command = "jq -f ~/.ssh/id_ed25519 data.json"
expect = "deny"
[[case]]
command = "jq --from-file=~/.ssh/id_ed25519 data.json"
expect = "deny"
[[case]]
command = "jq -f filter.jq ~/.netrc"
expect = "deny"
[[case]]
command = "jq -n --rawfile t ~/.netrc $t"
expect = "deny"
[[case]]
command = "jq -n --slurpfile t ~/.claude/.credentials.json .x"
expect = "deny"
[[case]]
command = "jq --arg k v .a -- ~/.netrc"
expect = "deny"
[[case]]
command = "yq . ~/.kube/config"
expect = "deny"
[[case]]
command = "yq eval -o json .users ~/.kube/config"
expect = "deny"
[[case]]
command = "yq --expression .a ~/.kube/config"
expect = "deny"
[[case]]
command = "jq .name package.json"
expect = "none"
[[case]]
command = "jq -r --indent=2 .name package.json"
expect = "none"
[[case]]
command = "jq --arg n v --argjson m 1 .a package.json"
expect = "none"
[[case]]
command = "jq -n --args $ARGS.positional a b"
expect = "none"
[[case]]
command = "jq -f"
expect = "none"
[[case]]
command = "yq e -o json -f extract .a config.yaml"
expect = "none"
[[case]]
command = "jq -n .x"
expect = "none"

# jq reads options after --args too, and -f in a short cluster; diff takes
# any unambiguous prefix of a long option.
[[case]]
command = "jq -n --args .x --rawfile t ~/.netrc a"
expect = "deny"
[[case]]
command = "jq -nf ~/.netrc data.json"
expect = "deny"
[[case]]
command = "jq -rf ~/.ssh/id_ed25519 data.json"
expect = "deny"
[[case]]
command = "jq ~/.ssh/id_ed25519 data.json -f"
expect = "deny"
[[case]]
command = "jq --args .x -- a ~/.netrc"
expect = "none"
[[case]]
command = "jq -rn .x"
expect = "none"
[[case]]
command = "diff --from=~/.netrc /dev/null"
expect = "deny"
[[case]]
command = "diff --to-f=~/.netrc /dev/null"
expect = "deny"
[[case]]
command = "sdiff --output=merged.txt a b"
expect = "none"
[[case]]
command = "diff --unified=3 --label=old a b"
expect = "none"
[[case]]
command = "yq --from-file=~/.ssh/id_ed25519 config.yaml"
expect = "deny"
[[case]]
command = "yq --from-file filter.yq config.yaml"
expect = "none"
[[case]]
command = "jq -n --rawfile t"
expect = "none"

# yq's load operators read a file named inside the expression; yq takes a
# file where the expression would go; jq's library path is read by import;
# any reader's --option=VALUE can name a file.
[[case]]
command = "yq -n 'load_str(strenv(HOME) + \"/.netrc\")'"
expect = "ask"
[[case]]
command = "yq '.a = load(\"other.yaml\")' config.yaml"
expect = "ask"
[[case]]
command = "yq --security-disable-file-ops '.a = load(\"other.yaml\")' config.yaml"
expect = "none"
[[case]]
command = "yq ~/.netrc"
expect = "deny"
[[case]]
command = "yq eval ~/.kube/config"
expect = "deny"
[[case]]
command = "yq '.a | . as $x | $x' config.yaml"
expect = "none"
[[case]]
command = "jq -L ~/.claude -n 'import \".credentials\" as $c; $c'"
expect = "deny"
[[case]]
command = "jq --library-path=~/.ssh -n 1"
expect = "deny"
[[case]]
command = "shuf --random-source=~/.netrc notes.txt"
expect = "deny"
[[case]]
command = "sort --files0-from=~/.netrc"
expect = "deny"
[[case]]
command = "sort --key=2 --field-separator=, data.csv"
expect = "none"
[[case]]
command = "yq 'eval(.expression)' project.yaml"
expect = "ask"
[[case]]
command = "jq --run-tests ~/.netrc"
expect = "deny"
[[case]]
command = "jq --run-tests tests.jq"
expect = "none"
[[case]]
command = "yq $DIR/.netrc"
expect = "ask"
[[case]]
command = "yq $HOME/.netrc"
expect = "deny"
# A command after a reserved word (a loop body, a condition, a group) is
# judged like the same command on its own; a for, select or case header runs
# nothing and is not judged as a command.
[[case]]
command = "for f in a b; do cat ~/.ssh/id_rsa; done"
expect = "deny"
[[case]]
command = "while true; do git push --force origin x; done"
expect = "deny"
[[case]]
command = "until false; do git push origin +main; done"
expect = "deny"
[[case]]
command = "if true; then cat ~/.ssh/id_rsa; fi"
expect = "deny"
[[case]]
command = "if false; then :; elif true; then cat ~/.ssh/id_rsa; fi"
expect = "deny"
[[case]]
command = "if false; then :; else cat ~/.ssh/id_rsa; fi"
expect = "deny"
[[case]]
command = "if git push --force origin x; then echo ok; fi"
expect = "deny"
[[case]]
command = "while git push --force origin x; do sleep 1; done"
expect = "deny"
[[case]]
command = "! cat ~/.ssh/id_rsa"
expect = "deny"
[[case]]
command = "{ cat ~/.ssh/id_rsa; }"
expect = "deny"
[[case]]
command = "f() { cat ~/.ssh/id_rsa; }; f"
expect = "deny"
[[case]]
command = "function f { git push --force origin x; }"
expect = "deny"
[[case]]
command = "case x in a) git push --force origin x;; esac"
expect = "deny"
[[case]]
command = "case x in a) :;; b) cat ~/.ssh/id_rsa;; esac"
expect = "deny"
[[case]]
command = "for i in 1; do HUSKY=0 git commit -m x; done"
expect = "deny"
[[case]]
command = "for i in 1; do timeout 5 git push --force origin x; done"
expect = "deny"
[[case]]
command = "for i in 1; do for j in 2; do cat ~/.ssh/id_rsa; done; done"
expect = "deny"
[[case]]
command = "for i in 1; do echo x; done > ~/.bashrc"
expect = "deny"
[[case]]
command = "for f in $(cat ~/.ssh/id_rsa); do echo $f; done"
expect = "deny"
[[case]]
command = "for f in a b; do echo $f; done"
expect = "none"
[[case]]
command = "for cat in ~/.ssh/id_rsa; do echo x; done"
expect = "none"
[[case]]
command = "case ~/.ssh/id_rsa in *) echo x;; esac"
expect = "none"
[[case]]
command = "if [ -f x ]; then git push origin feature; fi"
expect = "none"
[[case]]
command = "while read -r l; do echo $l; done < notes.txt"
expect = "none"
[[case]]
command = "select v in a b; do cat ~/.ssh/id_rsa; done"
expect = "deny"
[[case]]
command = "select v in a b; do echo $v; done"
expect = "none"
