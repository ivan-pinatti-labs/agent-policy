# Red-team: credential reads through plain commands (critical)
[[case]]
command = "cat ~/.ssh/id_ed25519"
expect = "deny"
[[case]]
command = "base64 /home/user/.aws/credentials"
expect = "deny"
[[case]]
command = "grep -r token ~/.config/gh"
expect = "deny"
[[case]]
command = "cat ~/.claude/.credentials.json"
expect = "deny"
[[case]]
command = "cat README.md"
expect = "none"
[[case]]
command = "ls ~/.ssh"
expect = "none"
[[case]]
command = "sed -n 1p ~/.claude/.credentials.json"
expect = "deny"

# Claude Code's tool-results files (large tool output it saves and tells the
# agent to read) are readable; the rest of ~/.claude stays a credential path.
[[case]]
command = "grep -n error ~/.claude/projects/-work-project/0123-abcd/tool-results/b1.txt"
expect = "none"
[[case]]
command = "head -50 ~/.claude/projects/-work-project/0123-abcd/tool-results/b1.txt"
expect = "none"
[[case]]
command = "sed -n 100,200p ~/.claude-work/projects/-work-project/0123-abcd/tool-results/b1.txt"
expect = "none"
[[case]]
command = "wc -l < ~/.claude/projects/-work-project/0123-abcd/tool-results/b1.txt"
expect = "none"
[[case]]
command = "cat ~/.claude/projects/-work-project/0123-abcd/tool-results/../../../../.credentials.json"
expect = "deny"
[[case]]
command = "cat ~/.claude/projects/-work-project/0123-abcd/tool-results/.credentials.json"
expect = "deny"
[[case]]
command = "grep token ~/.claude/projects/-work-project/0123-abcd.jsonl"
expect = "deny"
[[case]]
command = "grep -r token ~/.claude/projects"
expect = "deny"
[[case]]
command = "cat ~/.claude/tool-results/b1.txt"
expect = "deny"
[[case]]
command = "sed -i s/a/b/ ~/.claude/projects/-work-project/0123-abcd/tool-results/b1.txt"
expect = "deny"
[[case]]
command = "echo x > ~/.claude/projects/-work-project/0123-abcd/tool-results/b1.txt"
expect = "deny"
[[case]]
